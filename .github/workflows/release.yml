name: Build desktop apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: npm ci
      - name: Build (no publish)
        run: npx electron-builder --publish never
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p staged
          shopt -s nullglob
          for f in dist/*.exe dist/*.dmg dist/*.AppImage dist/*.zip dist/latest*.yml dist/*.blockmap; do cp "$f" staged/; done
          ls -la dist; ls -la staged
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.os }}
          path: staged/*
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dl
      - name: Collect + checksums
        shell: bash
        run: |
          mkdir -p release
          find dl -type f -exec cp -f {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "==== files ===="; ls -la; echo "==== checksums ===="; cat SHA256SUMS.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3 (cosign v3.1.4)
      - name: Sign checksums (keyless)
        shell: bash
        run: |
          cd release
          cosign sign-blob --yes --bundle SHA256SUMS.txt.sigstore.json SHA256SUMS.txt
      - name: Publish single release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Bulk Uploader for Figshare ${GITHUB_REF_NAME}" \
            --notes "Desktop apps for Windows, macOS and Linux - no admin rights needed. Verify with SHA256SUMS.txt (also signed via Sigstore cosign: SHA256SUMS.txt.sigstore.json; releases before v2.2.0 used .sig + .pem). Apps are unsigned binaries; first launch: Windows -> More info -> Run anyway, macOS -> right-click -> Open. See docs/DEPLOYMENT-AND-SECURITY.md. From v2.1.0 the apps show update notifications; the Windows installer and Linux AppImage can auto-update (disable with NO_UPDATE_CHECK=1)." \
          || gh release upload "${GITHUB_REF_NAME}" release/* --clobber --repo "${GITHUB_REPOSITORY}"
