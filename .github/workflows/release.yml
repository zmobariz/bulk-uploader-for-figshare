name: Build desktop apps
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: npm install
      - name: Build (no publish)
        run: npx electron-builder --publish never
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p staged
          shopt -s nullglob
          for f in dist/*.exe dist/*.dmg dist/*.AppImage dist/*.zip dist/latest*.yml dist/*.blockmap; do cp "$f" staged/; done
          ls -la dist; ls -la staged
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-${{ matrix.os }}
          path: staged/*
          if-no-files-found: error
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dl
      - name: Collect + checksums
        shell: bash
        run: |
          mkdir -p release
          find dl -type f -exec cp -f {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          echo "==== files ===="; ls -la; echo "==== checksums ===="; cat SHA256SUMS.txt
      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
      - name: Sign checksums (keyless)
        shell: bash
        run: |
          cd release
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.txt.sig \
            --output-certificate SHA256SUMS.txt.pem \
            SHA256SUMS.txt
      - name: Publish single release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" release/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Bulk Uploader for Figshare ${GITHUB_REF_NAME}" \
            --notes "Desktop apps for Windows, macOS and Linux - no admin rights needed. Verify with SHA256SUMS.txt (also signed via Sigstore cosign: SHA256SUMS.txt.sig + .pem). Apps are unsigned binaries; first launch: Windows -> More info -> Run anyway, macOS -> right-click -> Open. See docs/DEPLOYMENT-AND-SECURITY.md. From v2.1.0 the apps show update notifications; the Windows installer and Linux AppImage can auto-update (disable with NO_UPDATE_CHECK=1)." \
          || gh release upload "${GITHUB_REF_NAME}" release/* --clobber --repo "${GITHUB_REPOSITORY}"
